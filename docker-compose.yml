version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aicasa
      POSTGRES_PASSWORD: aicasa
      POSTGRES_DB: aicasa_dev
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10
    depends_on: [db]
    command: -configFiles=/flyway/conf/flyway.conf migrate
    volumes:
      - ./infra/db/flyway:/flyway/sql
      - ./infra/db/flyway.conf.example:/flyway/conf/flyway.conf:ro
    profiles: ["tools"]

volumes:
  dbdata:
