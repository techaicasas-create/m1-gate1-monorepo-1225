name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ✅ 最稳的 pnpm 安装方式：不用 pnpm/action-setup，避免 JSON/缓存坑
      - name: Enable corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.0.0 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile=false

      - name: OpenAPI lint
        run: pnpm openapi:lint

      - name: OpenAPI codegen
        run: pnpm openapi:codegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Contract tests (docker-compose)
        run: pnpm contract:test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: pipx install semgrep
      - name: Run semgrep rules
        run: semgrep --config security/semgrep.yml --error

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # M2：SCA 阻断（先以 HIGH/CRITICAL 为门槛）
      - name: Trivy fs (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
