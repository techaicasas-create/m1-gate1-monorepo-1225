  responses:
    BadRequest400:
      description: 请求参数错误 / 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized401:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden403:
      description: 无权限（或策略要求返回 404 以防止资源枚举）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound404:
      description: 资源不存在（或越权时按 404 处理）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict409:
      description: 并发冲突 / 乐观锁失败（expected_row_version/If-Match）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests429:
      description: 请求过于频繁（限流触发）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError500:
      description: 服务端异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed412:
      description: Precondition Failed（ETag/If-Match 不匹配，资源已被他人修改）
      content:
        application/json:
          schema: &id001
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired428:
      description: Precondition Required（缺少 If-Match；该接口启用强制乐观锁门禁）
      content:
        application/json:
          schema: *id001
  headers:
    ETag:
      description: 资源版本 ETag（由 rowVersion 派生）。用于 If-Match 乐观锁。
      schema:
        type: string
paths:
  /me:
    get:
      tags:
      - Auth & Profile
      summary: 获取当前登录用户信息（角色/绑定的 ownerId/tenantId/语言偏好）
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_UserMe'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalError500'
      x-rate-limit-tier: NONE
      x-error-strategy: '403'
  /me/preferences:
    patch:
      tags:
      - Auth & Profile
      summary: 更新当前用户偏好（语言/通知）
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredLanguage:
                  $ref: '#/components/schemas/LanguageCode'
                notificationPrefs:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_UserMe'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
        '500':
          $ref: '#/components/responses/InternalError500'
      x-rate-limit-tier: STANDARD
      x-audit: true
      x-audit-action: ME_UPDATE
      x-error-strategy: '403'
  /tenant-leads:
    post:
      tags:
      - Public
      summary: 提交租客线索（Homepage 表单）
      description: 公开接口：**必须**接入 Turnstile + 限流/风控；必须携带隐私政策同意（consents）。
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantLeadCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_TenantLead'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
        '500':
          $ref: '#/components/responses/InternalError500'
      x-rate-limit-tier: HIGH_RISK
      x-audit: true
      x-audit-action: LEAD_SUBMIT
      x-error-strategy: '400'
    get:
      tags:
      - Core
      summary: 查询租客线索（CRM/Admin）
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: status
        in: query
