      description: 建议优先走 `/files/presign-upload` + `/files/complete-upload`（signed
        URL）。本接口仅用于兼容旧流程/验收口径：最终落库为 Document(docType=PropertyImage, propertyId=...)。
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - docId
              properties:
                docId:
                  type: string
                  description: 已完成上传的 Document ID（推荐，配合 signed URL 流程）
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 兼容：直接上传文件（不推荐，建议用 signed URL）
                fileName:
                  type: string
                  nullable: true
                mime:
                  type: string
                  nullable: true
