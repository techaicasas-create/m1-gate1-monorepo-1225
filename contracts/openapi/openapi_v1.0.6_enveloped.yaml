openapi: 3.0.3
info:
  title: Hourglass Rentals API
  version: 1.0.6
  description: '面向西班牙（Spain）上线的租赁管理平台 API（Admin / Owner / Tenant + Public Website
    + CRM）。

    本文件是字段级接口“唯一真相源（Source of Truth）”。前后端均以此为准。


    约定：

    - 所有需要翻译展示的文本字段同时保留原文（*_original）并提供翻译缓存（*_i18n）与展示字段（*_display）。

    - 服务端根据用户偏好与请求头 Accept-Language 解析 viewerLanguage，并填充 *_display。

    - 所有时间使用 ISO 8601，货币默认 EUR。



    ---


    **M0 冻结说明（2025-12-24）**

    - 生产统一使用 `/v1`（server url 已带 `/v1`）；原 `/api` 仅作为短期兼容（可由网关 rewrite）。

    - 统一响应 Envelope：成功响应为 `{requestId,timestamp,data}`；错误响应为 `{requestId,timestamp,error}`。



    ### M0-FULL 补丁说明（v1.0.2）

    - 补齐：/health、/invitations、/gdpr、property images upload

    - 安全：补齐通用错误码（401/403/404/429/500）与 Cookie+CSRF 口径

    - 兼容：/api → /v1 下线计划见 `00_RELEASE/API_兼容与下线计划.md`



    ### M0-SUPER 补丁说明（v1.0.3）


    - 新增：`GET /v1/gdpr/jobs/{jobId}`（GDPR job 查询，便于前端轮询）

    - 新增：`POST /v1/auth/refresh`、`POST /v1/auth/logout`（Cookie 会话刷新/退出）

    - 安全：补充 refresh cookie 的可执行表达（`refreshCookie` security scheme）



    v1.0.4（M0-Ultimate）变更摘要：

    - GDPR：新增历史任务列表/筛选接口 `GET /gdpr/jobs`（支持 type/status/target 过滤 + cursor 分页）。

    - 并发：引入 If-Match / ETag 乐观锁约定（rowVersion 全链路），写接口可选强制门禁（412/428）。


    补充：ErrorResponse.error.code 已固定为 ErrorCode 枚举（前后端统一）。


    【v1.0.6 重要变更（M0修正）】

    - 金额字段：对外统一使用字符串（MoneyString），避免 JSON number 精度问题；落库使用 NUMERIC(18,2)。

    - Document 新增 scanStatus 字段（UPLOADED/SCANNING/READY/BLOCKED/FAILED）。

    - Public 线索接口：Turnstile 由“建议”提升为“必须”，并在请求体增加 turnstileToken。

    '
  contact:
    name: Product Owner (Client)
servers:
- url: https://api.example.com/v1
  description: Production (replace with your domain)
- url: https://staging-api.example.com/v1
  description: Staging
tags:
- name: Public
  description: 无需登录的公开接口（房源列表、线索提交）
- name: Auth & Profile
  description: 会话、当前用户与偏好（实际登录可能由外部 IdP 负责）
- name: Core
  description: 房源/租约/业主/租客等核心数据
- name: Tickets
  description: 工单（Tenant/Owner/Admin）
- name: Billing
  description: 账单与收款凭证（Invoice/Payment）
- name: Files
  description: 文件/文档中心（GCS / R2）
- name: Notifications
  description: 通知中心（可见性 + 已读）
- name: Doc Requests
  description: 资料请求（申请材料）
- name: Applications
  description: 申请流程与匹配（Onboarding）
- name: Ops
  description: 运维与健康检查（给 LB/监控用）
- name: GDPR
  description: GDPR 最小能力（导出/删除/匿名化），仅 Admin/Staff
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '建议使用 Google Identity Platform / Firebase Auth / Auth0 等签发 JWT；API
        侧只做校验与 RBAC。


        ⚠️ M0-FULL：浏览器端推荐使用 HttpOnly Cookie 会话（见 sessionCookie + CSRF），Bearer 仅建议用于服务到服务或本地调试。'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly Secure Session Cookie（浏览器端默认认证方式）。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF 防护 token（对所有写接口 POST/PUT/PATCH/DELETE 必须）。
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh
      description: HttpOnly Secure Refresh Cookie（用于会话刷新/轮换）。
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: zh-CN,es;q=0.9,en;q=0.8
      description: 期望返回的展示语言。服务端可结合用户偏好与此头决定 viewerLanguage。
    LangQuery:
      name: lang
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LanguageCode'
      description: 显式指定展示语言（优先级高于 Accept-Language）。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 游标分页（不透明字符串，由服务端生成）。
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: 乐观锁：客户端从响应头 ETag 获取并在更新/状态变更/删除时通过 If-Match 回传。推荐格式：W/"{rowVersion}".
  schemas:
    ErrorCode:
      type: string
      description: 统一错误码枚举（用于 ErrorResponse.error.code）。前后端/多端必须保持一致。
      enum:
      - VALIDATION_ERROR
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - PRECONDITION_REQUIRED
      - PRECONDITION_FAILED
      - RATE_LIMITED
      - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required:
      - error
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
          description: 请求追踪 ID（用于排障）
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: 服务端生成的响应时间戳
    LanguageCode:
      type: string
      description: 语言代码（最少满足西班牙上线：西语/英语/中文；巴塞可选加泰语）
      enum:
      - es
      - en
      - zh-CN
      - ca
      example: es
    I18nText:
      type: object
      description: 机器翻译缓存结构（用于用户输入文本：工单、通知、资料请求备注等）。
      required:
      - originalText
      - originalLang
      properties:
        originalText:
          type: string
          maxLength: 20000
        originalLang:
          $ref: '#/components/schemas/LanguageCode'
        translations:
          type: object
          description: key=LanguageCode，value=翻译文本
          additionalProperties:
            type: string
            maxLength: 20000
        displayText:
          type: string
          readOnly: true
          description: 服务端根据 viewerLanguage 解析后的展示文本。
        provider:
          type: string
          description: 翻译供应商/引擎标识（可选）
        model:
          type: string
          description: 模型/版本（可选）
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        updatedAt:
          type: string
          format: date-time
    UserRole:
      type: string
      enum:
      - ADMIN
      - OWNER
      - TENANT
    UserMe:
      type: object
      required:
      - userId
      - role
      - preferredLanguage
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        ownerId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        displayName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
        viewerLanguage:
          allOf:
          - $ref: '#/components/schemas/LanguageCode'
          readOnly: true
          description: 最终展示语言（服务端综合偏好 + header 解析结果）。
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    OwnerType:
      type: string
      enum:
      - natural_person
      - company
    Owner:
      type: object
      required:
      - id
      - ownerType
      - preferredLanguage
      - payoutIban
      - payoutAccountName
      properties:
        id:
          type: string
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        fullName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        name:
          type: string
          description: 兼容字段：展示名（系统内部可与 fullName/companyName 合并）
        idType:
          type: string
          enum:
          - DNI
          - NIE
          - PASSPORT
          - OTHER
          nullable: true
        idNumber:
          type: string
          nullable: true
        taxResidencyType:
          type: string
          description: 税务身份（示例枚举，可按你现有 portal 继续扩展）
          enum:
          - ES_RESIDENT_IRPF
          - EU_EEA_NON_RESIDENT_IRNR_19
          - NON_EU_NON_RESIDENT_IRNR_24
        taxResidencyCountry:
          type: string
          example: España
        taxRateOverride:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: 税率覆盖（0-1）。为空则用系统默认/参数表。
        email:
          type: string
          format: email
          nullable: true
        phoneMobile:
          type: string
          nullable: true
        phoneAlt:
          type: string
          nullable: true
        phone:
          type: string
          description: 兼容字段
          nullable: true
        addressStreet:
          type: string
          nullable: true
        addressCity:
          type: string
          nullable: true
        addressPostcode:
          type: string
          nullable: true
        addressCountry:
          type: string
          default: España
        preferredContactChannel:
          type: string
          enum:
          - email
          - phone
          - wechat
          - whatsapp
          default: email
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
        payoutAccountName:
          type: string
        payoutIban:
          type: string
        payoutBankName:
          type: string
          nullable: true
        payoutBicSwift:
          type: string
          nullable: true
        defaultCollectMode:
          type: string
          enum:
          - tenant_to_owner
          - tenant_to_agency
          - direct_debit
          default: tenant_to_owner
        defaultSettlementCycle:
          type: string
          enum:
          - monthly
          - quarterly
          - yearly
          default: yearly
        defaultMgmtFeePerPeriod:
          allOf:
          - $ref: '#/components/schemas/MoneyString'
          nullable: true
          description: 每期固定管理费（€）（字符串金额）
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    TenantType:
      type: string
      enum:
      - natural_person
      - company
    Tenant:
      type: object
      required:
      - id
      - tenantType
      - phoneMobile
      properties:
        id:
          type: string
        tenantType:
          $ref: '#/components/schemas/TenantType'
        fullName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        name:
          type: string
          description: 兼容字段：展示名
          nullable: true
        idType:
          type: string
          enum:
          - DNI
          - NIE
          - PASSPORT
          - OTHER
          nullable: true
        idNumber:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phoneMobile:
          type: string
        phoneAlt:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: 兼容字段
        addressStreet:
          type: string
          nullable: true
        addressCity:
          type: string
          nullable: true
        addressPostcode:
          type: string
          nullable: true
        addressCountry:
          type: string
          default: España
        preferredLanguage:
          allOf:
          - $ref: '#/components/schemas/LanguageCode'
          nullable: true
        notificationPrefs:
          type: object
          description: 通知偏好（可扩展）
          properties:
            channel:
              type: string
              enum:
              - in_app
              - email
              - whatsapp
              default: in_app
          additionalProperties: false
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    PropertyStatus:
      type: string
      enum:
      - 空置
      - 在租
      - 已出租
      - 维护中
      - 下架
    RentalMode:
